name: Liens des lieux

on:
  push:
    branches: [main]
    paths: [dates.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: venues
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chercher les sites et Instagram des nouveaux lieux
        run: node scripts/enrich-venues.mjs
      - name: Enregistrer venues.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add venues.json
          git diff --cached --quiet || (git commit -m "chore: liens des lieux (auto)" && git pull --rebase && git push)
