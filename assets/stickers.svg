<!--
  stickers.svg — Bibliothèque de formes réutilisables pour AïDN
  Palette officielle (charte RMY) : #47007F · #9500FF · #C766FF · #EE9FFF · #F3E1FF

  Inspiré des screens Pinterest (collage Y2K, autocollants aux bords
  déchirés, halftone, star-burst) mais recodé en formes vectorielles
  originales dans TES couleurs de marque — rien n'est copié des images.

  Ce fichier sert de planche de référence (à ouvrir dans le navigateur
  ou à importer dans Illustrator/Figma). Les formes utilisées en direct
  sur le site sont ré-encodées en <defs> inline dans index.html pour une
  compatibilité maximale avec clip-path.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" width="0" height="0">
  <defs>

    <!-- Bord déchiré / die-cut, même famille que le logo AïDN -->
    <clipPath id="jaggedFrame" clipPathUnits="objectBoundingBox">
      <path d="M0.03,0.08 L0.22,0.02 L0.24,0.09 L0.4,0 L0.42,0.07 L0.6,0.01
               L0.62,0.08 L0.8,0.02 L0.97,0.1 L1,0.25 L0.93,0.4 L1,0.55
               L0.96,0.72 L1,0.9 L0.85,0.98 L0.68,0.93 L0.5,1 L0.33,0.94
               L0.16,1 L0.02,0.9 L0.08,0.74 L0,0.58 L0.06,0.42 L0,0.26 Z" />
    </clipPath>

    <!-- Étoile "burst" façon pochette Y2K -->
    <symbol id="starBurst" viewBox="0 0 200 200">
      <path fill="currentColor" d="M100 0 L112 68 L170 30 L138 92 L200 100
               L138 108 L170 170 L112 132 L100 200 L88 132 L30 170 L62 108
               L0 100 L62 92 L30 30 L88 68 Z"/>
    </symbol>

    <!-- Badge "splat" pour tags courts (NOUVEAU, DISPO...) -->
    <symbol id="splatBadge" viewBox="0 0 220 140">
      <path fill="currentColor" d="M14,52 C6,38 18,20 36,18 C40,4 64,-2 78,8
               C96,-4 124,-2 134,12 C156,2 184,10 190,30 C210,32 216,58 202,72
               C214,88 204,112 184,116 C180,130 156,138 140,128
               C124,140 96,138 84,124 C64,136 36,130 28,112
               C8,110 0,86 12,70 Z"/>
    </symbol>

    <!-- Coin "sticker peel" (angle de post-it légèrement décollé) -->
    <symbol id="peelCorner" viewBox="0 0 100 100">
      <path fill="currentColor" d="M0,0 H100 V70 C80,60 60,90 40,80 C22,72 12,50 0,55 Z"/>
    </symbol>

    <!-- Bande de scotch washi, bords légèrement déchirés -->
    <symbol id="tapeStrip" viewBox="0 0 300 80">
      <path fill="currentColor" fill-opacity="0.85"
            d="M0,4 L20,2 L60,6 L100,3 L140,5 L180,2 L220,6 L260,3 L280,5 L300,3
               L300,74 L280,77 L260,73 L220,76 L180,73 L140,77 L100,74 L60,77 L20,73 L0,76 Z"/>
    </symbol>

    <!-- Anneau vinyle (clin d'oeil disque / platine) -->
    <symbol id="vinylRing" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="96" fill="none" stroke="currentColor" stroke-width="2" opacity=".9"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".7"/>
      <circle cx="100" cy="100" r="60" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
      <circle cx="100" cy="100" r="42" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".4"/>
      <circle cx="100" cy="100" r="10" fill="currentColor"/>
    </symbol>

    <!-- Flèche "scribble" tracée à main levée -->
    <symbol id="scribbleArrow" viewBox="0 0 140 70">
      <path fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
            d="M6,54 C34,10 78,6 110,26"/>
      <path fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
            d="M86,16 L112,26 L100,50"/>
    </symbol>

    <!-- Variante 2 du cadre déchiré (blob plus arrondi) -->
    <clipPath id="jaggedFrame2" clipPathUnits="objectBoundingBox">
      <path d="M0.1,0 L0.9,0.02 L1,0.14 L0.96,0.3 L1,0.48 L0.94,0.64
               L1,0.8 L0.92,0.96 L0.76,0.9 L0.6,1 L0.44,0.92 L0.28,1
               L0.14,0.9 L0,0.96 L0.04,0.78 L0,0.6 L0.06,0.42 L0,0.24
               L0.06,0.08 Z" />
    </clipPath>

  </defs>
</svg>
